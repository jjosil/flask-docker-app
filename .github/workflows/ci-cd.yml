name: "Flask app on GitHub"

run-name: "Flask CI/CD Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allow to manually check_run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run basic test
        run: python - "import flask"

      - name: Build Docker image
        run: |
          docker build -t flask-docker-app .

  docker-push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Debug username
        run: echo "User ${{ secrets.DOCKER_USERNAME }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-docker-app:latest .
          docker push ${{ secrets.DOCKER_PASSWORD }}/flask-docker-app:latest